name: Website verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify JavaScript syntax
        run: |
          node --check public/assets/site.mjs
          node --check scripts/build.mjs
          node --check scripts/check.mjs
          node --check scripts/serve.mjs
      - run: npm run build
      - name: Require committed production output
        run: git diff --exit-code -- public
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: nexusapp-static
          path: public/
          retention-days: 14
